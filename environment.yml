# Environment that produced the paper's numbers (Anaconda Python 3.12.4).
# Key outputs have also been reproduced byte-identically on Python 3.10.12 with
# numpy 2.2.6 / scipy 1.15.3 / pandas 2.3.3, so moderate version drift is tolerated;
# the pins below are the tested reference.
name: adoption
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.2
  - matplotlib=3.8.4
  - scikit-learn=1.4.2
  - statsmodels=0.14.2
  - openpyxl=3.1.2
  - pip
  - pip:
      # needed only by src/benchmark/deep/ (tested: torch 2.11.0)
      - torch
      # needed only by takeoff_ewstools_check.py and pca_bimodality_prune.py
      - ewstools
      - diptest
# Times New Roman is used in figures; without it matplotlib falls back to a
# similar serif (figures remain correct, fonts differ slightly).
